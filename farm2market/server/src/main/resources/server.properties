# Farm2Market Server Configuration

# Server Settings
server.port=8888
server.max.connections=100
server.thread.pool.size=20
server.connection.timeout=30000
server.read.timeout=60000

# Database Settings (SQLite - default for development)
db.type=sqlite
db.url=jdbc:sqlite:farm2market.db
db.username=
db.password=

# Database Settings (MySQL - for production)
# db.type=mysql
# db.url=jdbc:mysql://localhost:3306/farm2market?useSSL=false&serverTimezone=UTC
# db.username=farm2market
# db.password=your_password

# Connection Pool
db.pool.size=10
db.pool.min.idle=2
db.pool.max.idle=5
db.pool.max.wait=10000

# Session Settings
session.duration.hours=168
session.token.length=64

# Business Rules
order.delivery.fee=30.0
order.free.delivery.min=500.0
cart.max.items=50

# File Paths
export.directory=exports
audit.log.file=audit.log

# Logging
log.level=INFO
log.to.console=true
log.to.file=true
